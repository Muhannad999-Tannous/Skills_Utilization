name: Security Scans (Non-Blocking Output Logs)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Enables pushing result log files back to GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # STEP 1: TruffleHog (Secrets Scan)
      # Excludes .git to prevent flagging git credentials in .git/config
      # -------------------------------------------------------------
      # -------------------------------------------------------------
      # STEP 1: TruffleHog (Secrets Scan)
      # -------------------------------------------------------------
      # -------------------------------------------------------------
      # STEP 1: TruffleHog (Secrets Scan)
      # -------------------------------------------------------------
      - name: Run TruffleHog Scan
        id: trufflehog
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --exclude-paths=(^|/)\.git(/|$) > trufflehog_results.log 2>&1      # -------------------------------------------------------------
      # STEP 2: Hadolint (Dockerfile Linting)
      # -------------------------------------------------------------
      - name: Run Hadolint Scan
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/root" -w /root hadolint/hadolint hadolint Dockerfile > hadolint_results.log 2>&1

      # -------------------------------------------------------------
      # STEP 3: Bandit (Python Security Scan)
      # -------------------------------------------------------------
      - name: Run Bandit Scan
        id: bandit
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/app" cytopia/bandit -r /app > bandit_results.log 2>&1

      # -------------------------------------------------------------
      # COMMIT LOG FILES TO REPOSITORY
      # -------------------------------------------------------------
      - name: Commit Tool Log Files to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f trufflehog_results.log hadolint_results.log bandit_results.log
          git commit -m "build(security): update scan results logs" || echo "No changes to commit"
          git push
