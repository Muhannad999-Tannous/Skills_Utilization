name: Security Scans (Non-Blocking Output Logs)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # STEP 1: TruffleHog (Secrets Scan)
      # -------------------------------------------------------------
      - name: Run TruffleHog Scan
        id: trufflehog
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/pwd" -w /pwd trufflesecurity/trufflehog:latest filesystem . --exclude-paths="^\./\.git/" > trufflehog_results.log 2>&1

      # -------------------------------------------------------------
      # STEP 2: Hadolint (Dockerfile Linting)
      # -------------------------------------------------------------
      - name: Run Hadolint Scan
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/root" -w /root hadolint/hadolint hadolint Dockerfile > hadolint_results.log 2>&1

      # -------------------------------------------------------------
      # STEP 3: Bandit (Python Security Scan)
      # -------------------------------------------------------------
      - name: Run Bandit Scan
        id: bandit
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/app" cytopia/bandit -r /app > bandit_results.log 2>&1

      # -------------------------------------------------------------
      # UPLOAD RESULTS AS A DOWNLOADABLE ARTIFACT
      # -------------------------------------------------------------
      - name: Upload Security Scan Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-logs
          path: |
            trufflehog_results.log
            hadolint_results.log
            bandit_results.log
